<!-- Hero banner (dark theme) — Mordehai Levy. Pure SVG + SMIL, no JS. -->
<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Mordehai Levy — Full-Stack & AI Developer">
  <defs>
    <!-- Accent gradient, slowly animated -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="338" rx="22"/></clipPath>
  </defs>

  <!-- Card background -->
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0B1220"/>
    <!-- Floating background glows -->
    <circle cx="180" cy="90" r="150" fill="url(#blobA)" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 30; 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="250" r="170" fill="url(#blobB)" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -50 -20; 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <!-- Subtle dot grid -->
    <g fill="#FFFFFF" opacity="0.05">
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
        <circle cx="1.5" cy="1.5" r="1.5"/>
      </pattern>
      <rect width="1200" height="340" fill="url(#dots)"/>
    </g>
  </g>
  <!-- Thin border -->
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Avatar / monogram -->
  <g transform="translate(96,110)">
    <circle cx="60" cy="60" r="62" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="60" cy="60" r="52" fill="url(#avatar)"/>
    <text x="60" y="78" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="44" font-weight="700" fill="#0B1220">ML</text>
  </g>

  <!-- Name + headline -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="250" y="132" font-size="46" font-weight="800" fill="#F8FAFC">Mordehai Levy</text>
    <text x="252" y="176" font-size="23" font-weight="600" fill="url(#accent)">Full-Stack &amp; AI Developer</text>
    <text x="252" y="208" font-size="16" fill="#94A3B8">Automation · SaaS · Developer Experience · Claude Code &amp; MCP</text>

    <!-- Location row -->
    <g transform="translate(252,236)" fill="#94A3B8">
      <path d="M8 0a7 7 0 0 0-7 7c0 5 7 11 7 11s7-6 7-11a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 8 4.5a2.5 2.5 0 0 1 0 5z"/>
      <text x="22" y="14" font-size="15">Tel Aviv, Israel</text>
    </g>

    <!-- CTA pills -->
    <g transform="translate(252,268)">
      <rect x="0" y="0" width="150" height="40" rx="20" fill="url(#accent)"/>
      <text x="75" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0B1220">View Projects</text>
      <rect x="166" y="0" width="130" height="40" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="231" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#F8FAFC">Get in touch</text>
    </g>
  </g>
</svg>
