<!-- Project thumbnail: Cortanyx. Theme-agnostic, pure SVG. -->
<svg width="1600" height="360" viewBox="0 0 1600 360" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cortanyx project card">
