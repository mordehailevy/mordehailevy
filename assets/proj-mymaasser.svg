<!-- Project thumbnail: MyMaasser. Theme-agnostic, pure SVG. -->
<svg width="800" height="360" viewBox="0 0 800 360" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MyMaasser project card">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="g" cx="0.85" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#F8FAFC" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="c"><rect x="1" y="1" width="798" height="358" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="800" height="360" fill="#0F172A"/>
    <rect width="800" height="360" fill="url(#dots)"/>
    <rect width="800" height="360" fill="url(#g)"/>
    <rect width="8" height="360" fill="url(#a)"/>
  </g>
  <rect x="1" y="1" width="798" height="358" rx="24" fill="none" stroke="#F8FAFC" stroke-opacity="0.08"/>

  <rect x="56" y="56" width="104" height="104" rx="26" fill="url(#a)"/>
  <text x="108" y="126" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="44" font-weight="800" fill="#0F172A">MM</text>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="192" y="98" font-size="15" font-weight="600" letter-spacing="3" fill="#34D399">SAAS · FINANCE</text>
    <text x="192" y="148" font-size="42" font-weight="800" fill="#F8FAFC">MyMaasser</text>
  </g>

  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="16" font-weight="600">
    <rect x="56" y="240" width="150" height="44" rx="22" fill="#F8FAFC" fill-opacity="0.06" stroke="#F8FAFC" stroke-opacity="0.14"/>
    <text x="131" y="268" text-anchor="middle" fill="#67E8F9">TypeScript</text>
    <rect x="222" y="240" width="150" height="44" rx="22" fill="#F8FAFC" fill-opacity="0.06" stroke="#F8FAFC" stroke-opacity="0.14"/>
    <text x="297" y="268" text-anchor="middle" fill="#93C5FD">PostgreSQL</text>
    <rect x="388" y="240" width="96" height="44" rx="22" fill="#F8FAFC" fill-opacity="0.06" stroke="#F8FAFC" stroke-opacity="0.14"/>
    <text x="436" y="268" text-anchor="middle" fill="#6EE7B7">SaaS</text>
  </g>
</svg>
