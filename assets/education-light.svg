<!-- Education card (light theme). Pure SVG. -->
<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Education: John Bryce, Tel Aviv — Full Stack Development, Artificial Intelligence, Cloud Computing">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="1198" height="218" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="220" fill="#F8FAFC"/>
    <rect width="6" height="220" fill="url(#accent)"/>
  </g>
  <rect x="1" y="1" width="1198" height="218" rx="18" fill="none" stroke="#0F172A" stroke-opacity="0.08"/>

  <g transform="translate(56,74)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M36 6 L70 22 L36 38 L2 22 Z"/>
    <path d="M18 30 V48 C18 54 54 54 54 48 V30"/>
    <path d="M70 22 V40"/>
  </g>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="150" y="70" font-size="15" font-weight="600" fill="#0891B2" letter-spacing="2">EDUCATION</text>
    <text x="150" y="108" font-size="30" font-weight="800" fill="#0F172A">John Bryce — Tel Aviv</text>
    <text x="150" y="140" font-size="18" fill="#475569">Full Stack Development &amp; Artificial Intelligence</text>

    <g font-size="14" font-weight="600">
      <rect x="150" y="160" width="168" height="34" rx="17" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-opacity="0.4"/>
      <text x="234" y="182" text-anchor="middle" fill="#1D4ED8">Full Stack Development</text>

      <rect x="330" y="160" width="168" height="34" rx="17" fill="#06B6D4" fill-opacity="0.10" stroke="#06B6D4" stroke-opacity="0.4"/>
      <text x="414" y="182" text-anchor="middle" fill="#0E7490">Artificial Intelligence</text>

      <rect x="510" y="160" width="150" height="34" rx="17" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="585" y="182" text-anchor="middle" fill="#047857">Cloud Computing</text>
    </g>
  </g>
</svg>
