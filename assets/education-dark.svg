<!-- Education card (dark theme). Pure SVG. -->
<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Education: John Bryce, Tel Aviv — Full Stack Development, Artificial Intelligence, Cloud Computing">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="1198" height="218" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="220" fill="#0F172A"/>
    <rect width="6" height="220" fill="url(#accent)"/>
  </g>
  <rect x="1" y="1" width="1198" height="218" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Graduation cap icon -->
  <g transform="translate(56,74)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M36 6 L70 22 L36 38 L2 22 Z"/>
    <path d="M18 30 V48 C18 54 54 54 54 48 V30"/>
    <path d="M70 22 V40"/>
  </g>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="150" y="70" font-size="15" font-weight="600" fill="#22D3EE" letter-spacing="2">EDUCATION</text>
    <text x="150" y="108" font-size="30" font-weight="800" fill="#F8FAFC">John Bryce — Tel Aviv</text>
    <text x="150" y="140" font-size="18" fill="#94A3B8">Full Stack Development &amp; Artificial Intelligence</text>

    <!-- Tags -->
    <g font-size="14" font-weight="600">
      <rect x="150" y="160" width="168" height="34" rx="17" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-opacity="0.5"/>
      <text x="234" y="182" text-anchor="middle" fill="#C4B5FD">Full Stack Development</text>

      <rect x="330" y="160" width="168" height="34" rx="17" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="414" y="182" text-anchor="middle" fill="#67E8F9">Artificial Intelligence</text>

      <rect x="510" y="160" width="150" height="34" rx="17" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.5"/>
      <text x="585" y="182" text-anchor="middle" fill="#6EE7B7">Cloud Computing</text>
    </g>
  </g>
</svg>
