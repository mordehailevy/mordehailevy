<!-- Animated terminal (light theme). Pure SVG + SMIL, no JS. -->
<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Terminal: whoami — Full Stack Developer, AI Engineer, Automation Developer, Claude Code Enthusiast, Always Building">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <clipPath id="win"><rect x="1" y="1" width="1198" height="278" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1200" height="280" fill="#FFFFFF"/>
    <rect width="1200" height="44" fill="#F1F5F9"/>
  </g>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="none" stroke="#0F172A" stroke-opacity="0.08"/>

  <circle cx="26" cy="22" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="22" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="22" r="6" fill="#27C93F"/>
  <text x="600" y="27" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace"
        font-size="13" fill="#64748B">mordehai@dev — zsh</text>

  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="18">
    <text x="34" y="92" fill="#059669">$</text>
    <text x="56" y="92" fill="#0F172A">whoami</text>

    <g fill="url(#accent)" font-weight="600">
      <text x="34" y="130" opacity="0">Full Stack Developer
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
      </text>
      <text x="34" y="160" opacity="0">AI Engineer
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
      </text>
      <text x="34" y="190" opacity="0">Automation Developer
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.6s" fill="freeze"/>
      </text>
      <text x="34" y="220" opacity="0">Claude Code Enthusiast
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.1s" fill="freeze"/>
      </text>
      <text x="34" y="250" opacity="0">Always Building
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.6s" fill="freeze"/>
      </text>
    </g>

    <rect x="230" y="236" width="11" height="20" fill="#06B6D4" opacity="0">
      <animate attributeName="opacity" values="0;0" dur="2.9s" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
